<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive TV Wall</title>

    <!-- Preconnect for video sources -->
    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="preconnect" href="https://player.twitch.tv">
    <link rel="preconnect" href="https://clips.twitch.tv">
    <link rel="preconnect" href="https://pluto.tv">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="preset-bar">
        <div class="preset-controls">
            <label for="preset-select">Preset:</label>
            <select id="preset-select">
                <option value="0">Preset 1 - Default</option>
                <option value="1">Preset 2</option>
                <option value="2">Preset 3</option>
            </select>
        </div>
        <section class="news-ticker" aria-label="Live news">
            <div class="news-brand">
                <span class="news-live-dot" aria-hidden="true"></span>
                <span>LIVE NEWS</span>
            </div>
            <div class="news-story" aria-live="polite">
                <div class="news-meta">
                    <span class="news-source">Loading headlines</span>
                    <div class="news-times">
                        <time class="news-posted" hidden></time>
                        <time class="news-snapshot-updated" hidden></time>
                    </div>
                </div>
                <a class="news-headline" tabindex="-1">Fetching the latest stories…</a>
                <p class="news-summary" hidden></p>
            </div>
        </section>
    </div>

    <div class="grid"></div>

    <script src="default-urls.js"></script>
    <script src="app.js"></script>
</body>

</html>
