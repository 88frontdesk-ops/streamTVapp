name: Publish RSS snapshot

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Fetch feeds and prepare site
        run: |
          mkdir -p _site
          cp app.js default-urls.js index.html styles.css _site/
          node -e 'global.window = {}; require("./default-urls.js"); process.stdout.write(JSON.stringify(window.DEFAULT_RSS_FEEDS));' |
            python scripts/update_rss_snapshot.py --output _site/feeds.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site

      - name: Allow Pages artifact to propagate
        run: sleep 10

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 600000
          error_count: 20
          reporting_interval: 5000

      - name: Verify published RSS snapshot
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail

          expected_generated_at="$(python -c 'import json; print(json.load(open("_site/feeds.json", encoding="utf-8"))["generatedAt"])')"
          base_url="${PAGE_URL%/}"

          for attempt in $(seq 1 12); do
            response="$(curl --fail --silent --show-error \
              "${base_url}/feeds.json?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" || true)"
            actual_generated_at="$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin).get("generatedAt", ""))' 2>/dev/null || true)"

            if [[ "$actual_generated_at" == "$expected_generated_at" ]]; then
              echo "Verified deployed RSS snapshot: $actual_generated_at"
              exit 0
            fi

            echo "Attempt $attempt: waiting for GitHub Pages to serve the new snapshot (expected $expected_generated_at, got ${actual_generated_at:-no response})."
            sleep 5
          done

          echo "::error::The deployed feeds.json did not match the generated RSS snapshot."
          exit 1
